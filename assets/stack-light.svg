<title id="t">Full-stack: how a request travels through my work</title>
<desc id="d">Interface: React, Next.js 15, TypeScript, Tailwind · ShadCN. State &amp; forms: Redux · RTK Query, React Query, React Hook Form, Yup. Auth: Keycloak, NextAuth, Supabase RLS, RBAC. Server: Node.js, Express, Server Actions, REST. Data: PostgreSQL, MongoDB, Supabase, Firebase. Ship: Docker, Git, CI/CD, Jest, Netlify, Vercel, Cloudflare R2.</desc>
