<svg xmlns="http://www.w3.org/2000/svg" width="410" height="196" viewBox="0 0 410 196" role="img" aria-labelledby="t d">
<title id="t">Billion API Admin</title>
<desc id="d">platform · admin. Built the admin panel and led its migration from the Next.js 14 Pages Router to the Next.js 15 App Router. Built with Next.js 15, NextAuth, Recharts.</desc>
<style>
  text { font-kerning: normal; }
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease both; }
  .rule { animation: draw 1.2s cubic-bezier(.6,0,.2,1) both; stroke-dasharray: 1000; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
  
        @keyframes grow { 0% { transform: scaleY(0); } 30%, 85% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
        @keyframes squeeze { 0% { transform: scaleX(1.25); opacity: .3; } 30%, 85% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1.25); opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>

