<title id="t">Impact in numbers</title>
<desc id="d">5 yrs: shipping production web applications. 94.58%: Docker image cut from 2.88 GB to 156 MB. 3: government platforms elections &amp; civil registry. 14 → 15: led the Next.js App Router migration</desc>
<style>
  text { font-kerning: normal; }
  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fade .8s ease both; }
  .rule { animation: draw 1.2s cubic-bezier(.6,0,.2,1) both; stroke-dasharray: 1000; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .55; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
  
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
