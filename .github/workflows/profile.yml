name: Rebuild profile

on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC (09:17 in Dhaka)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install: the generator has zero dependencies.
      - name: Build SVGs and README
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a fine-grained PAT (read-only "Metadata" on all your repos)
          # so private repos count in the language bar and private contributions are included.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A assets README.md
            git commit -m "chore: rebuild profile visuals"
            git push
          else
            echo "No changes."
          fi
